name: Validate plugin

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  plugin-validation:
    name: Claude Code plugin validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.218

      - name: Validate plugin
        run: claude plugin validate . --strict

  expert-manager-tests:
    name: MobileWork Expert Manager tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install PyYAML==6.0.3

      - name: Run unit tests
        run: >-
          python -m unittest discover
          -s skills/mobilework-expert-manager/tests
          -p 'test_*.py'
